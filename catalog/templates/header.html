<header class="bg-white border-bottom shadow-sm">
    <nav class="navbar navbar-expand-md container py-3" aria-label="Основная навигация">
        <a class="navbar-brand fw-semibold" href="{% url 'home' %}">SkyStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
            <div class="navbar-nav ms-auto gap-2 pt-3 pt-md-0">
                <a class="btn btn-primary" aria-current="page" href="{% url 'home' %}">Каталог</a>
                <a class="btn btn-outline-primary" href="{% url 'posts_list' %}">Посты</a>
                <a class="btn btn-outline-primary" href="{% url 'contacts' %}">Контакты</a>
                <a class="btn btn-outline-primary" href="{% url 'add_product' %}">Добавить товар</a>
                <a class="btn btn-outline-primary" href="{% url 'add_post' %}">Добавить пост</a>
                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}"
                   class="btn btn-outline-primary d-inline-flex align-items-center gap-2">

                    {% if user.avatar and user.avatar.name != "avatars/default.jpg" %}
                    <img src="{{ user.avatar.url }}"
                         alt=""
                         width="28"
                         height="28"
                         class="rounded-circle flex-shrink-0"
                         style="object-fit: cover;">
                    {% else %}
                    <span class="rounded-circle bg-primary text-white d-inline-flex
                     align-items-center justify-content-center flex-shrink-0"
                          style="width: 28px; height: 28px;"
                          aria-hidden="true">
                          {{ user.email|first|upper }}
                    </span>
                    {% endif %}

                    <span>Мой профиль</span>
                </a>
                {% else %}
                <a class="btn btn-outline-primary" href="{% url 'login' %}">
                    Войти
                </a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
