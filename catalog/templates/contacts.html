<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyStore — контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<header class="bg-white border-bottom shadow-sm">
    <nav class="navbar navbar-expand-md container py-3" aria-label="Основная навигация">
        <a class="navbar-brand fw-semibold" href="/">SkyStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
            <div class="navbar-nav ms-auto gap-2 pt-3 pt-md-0">
                <a class="btn btn-outline-primary" href="/">Каталог</a>
                <a class="btn btn-primary" aria-current="page" href="/contacts">Контакты</a>
            </div>
        </div>
    </nav>
</header>

<main class="container flex-grow-1 py-5">
    <h1 class="display-4 fw-semibold text-center mb-5">Контакты</h1>
    <div class="row g-4">
        <div class="col-lg-8">
            <section class="card shadow-sm h-100" aria-labelledby="details-title">
                <div class="card-header py-3"><h2 class="h4 mb-0" id="details-title">Реквизиты компании</h2></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <tbody>
                            <tr><th class="p-3" scope="row">Страна</th><td class="p-3">USA</td></tr>
                            <tr><th class="p-3" scope="row">ИНН</th><td class="p-3">91-1144442</td></tr>
                            <tr><th class="p-3" scope="row">Адрес</th><td class="p-3">Redmond, WA, 98052-6399</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="card shadow-sm" aria-labelledby="form-title">
                <div class="card-header py-3"><h2 class="h4 mb-0" id="form-title">Свяжитесь с нами</h2></div>
                <div class="card-body p-4">
                    {% if message %}
                    <p style="color: #1aff00"> {{ message }} </p>
                    {% endif %}
                    <form action="#" method="post">
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label" for="name">Имя</label><input class="form-control" id="name" name="name" type="text" placeholder="Ваше имя" required></div>
                        <div class="mb-3"><label class="form-label" for="phone">Телефон</label><input class="form-control" id="phone" name="phone" type="tel" placeholder="Контактный телефон" required></div>
                        <div class="mb-3"><label class="form-label" for="message">Сообщение</label><textarea class="form-control" id="message" name="message" rows="4" placeholder="Ваше сообщение" required></textarea></div>
                        <button class="btn btn-outline-primary btn-lg w-100" type="submit">Отправить</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>

<footer class="bg-white border-top mt-auto">
    <div class="container py-4 d-flex flex-column flex-sm-row justify-content-between gap-2">
        <div><strong>SkyStore</strong><small class="d-block text-secondary">&copy; 2026</small></div>
        <a class="link-secondary align-self-sm-center" href="/">Вернуться в каталог</a>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
